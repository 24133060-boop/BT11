<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh Toán Đơn Hàng - Premium Store</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8f9fa;
            color: #2b2d42;
        }
        .checkout-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background: #ffffff;
        }
        .form-control, .form-select {
            border-radius: 10px;
            padding: 12px 16px;
            border: 1px solid #e2e8f0;
            background-color: #ffffff;
        }
        .form-control:focus, .form-select:focus {
            box-shadow: 0 0 0 4px rgba(13, 110, 253, 0.15);
            border-color: #0d6efd;
        }
        .btn-action {
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(13, 110, 253, 0.2);
        }
        .summary-box {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <!-- Top Navigation -->
        <div class="mb-4">
            <a href="/cart" class="btn btn-light text-secondary border fw-semibold shadow-sm rounded-3">
                <i class="fa-solid fa-arrow-left me-1"></i> Quay lại Giỏ hàng
            </a>
        </div>

        <div class="row g-4">
            <!-- Cột trái: Form nhập thông tin -->
            <div class="col-lg-7">
                <div class="card checkout-card p-4 p-md-5">
                    <div class="d-flex align-items-center gap-3 mb-4">
                        <div class="p-3 bg-primary-subtle text-primary rounded-3">
                            <i class="fa-solid fa-truck-fast fa-2x"></i>
                        </div>
                        <div>
                            <h4 class="fw-bold mb-0">Thông Tin Giao Hàng</h4>
                            <p class="text-muted small mb-0">Vui lòng điền thông tin để hoàn tất đơn hàng</p>
                        </div>
                    </div>

                    <form th:action="@{/cart/checkout}" th:object="${order}" method="post">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Họ và tên người nhận <span class="text-danger">*</span></label>
                                <input type="text" th:field="*{customerName}" class="form-control" placeholder="Nguyễn Văn A" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Số điện thoại <span class="text-danger">*</span></label>
                                <input type="tel" th:field="*{phone}" class="form-control" placeholder="0901234567" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-semibold">Địa chỉ nhận hàng chi tiết <span class="text-danger">*</span></label>
                                <input type="text" th:field="*{address}" class="form-control" placeholder="Số nhà, Tên đường, Phường/Xã, Quận/Huyện..." required>
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-semibold">Phương thức thanh toán</label>
                                <select th:field="*{paymentMethod}" class="form-select">
                                    <option value="COD">Thanh toán khi nhận hàng (COD)</option>
                                    <option value="MOMO">Ví MoMo</option>
                                    <option value="BANKING">Chuyển khoản ngân hàng</option>
                                </select>
                            </div>
                        </div>

                        <div class="mt-4 pt-3 border-top d-flex gap-2">
                            <a href="/cart" class="btn btn-light border w-50 btn-action text-secondary">Hủy bỏ</a>
                            <button type="submit" class="btn btn-primary w-50 btn-action shadow">
                                <i class="fa-solid fa-check me-2"></i> XÁC NHẬN ĐẶT HÀNG
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Cột phải: Xem trước sản phẩm & Tổng tiền -->
            <div class="col-lg-5">
                <div class="card checkout-card p-4">
                    <h5 class="fw-bold mb-3"><i class="fa-solid fa-receipt text-primary me-2"></i>Đơn Hàng Của Bạn</h5>
                    
                    <!-- Bảng tóm tắt sản phẩm trong giỏ -->
                    <div class="summary-box p-3 mb-3" th:if="${cartItems != null && !#lists.isEmpty(cartItems)}">
                        <div class="d-flex justify-content-between align-items-center mb-2 pb-2 border-bottom" th:each="item : ${cartItems}">
                            <div>
                                <span class="fw-semibold text-dark d-block" th:text="${item.productName != null ? item.productName : 'Sản phẩm #' + item.productId}">Sản phẩm A</span>
                                <small class="text-muted">Số lượng: <span th:text="${item.quantity}">1</span> x <span th:text="${#numbers.formatDecimal(item.price, 0, 'COMMA', 0, 'POINT')} + ' đ'">100.000 đ</span></small>
                            </div>
                            <span class="fw-bold text-primary" th:text="${#numbers.formatDecimal(item.price * item.quantity, 0, 'COMMA', 0, 'POINT')} + ' đ'">100.000 đ</span>
                        </div>
                    </div>

                    <hr class="text-muted opacity-25">

                    <!-- Tính tổng -->
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <span class="text-muted">Tạm tính:</span>
                        <span class="fw-semibold" th:text="${order.totalAmount != null ? #numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT') + ' đ' : '0 đ'}">0 đ</span>
                    </div>
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <span class="text-muted">Phí vận chuyển:</span>
                        <span class="text-success fw-semibold"><i class="fa-solid fa-check-circle me-1"></i>Miễn phí</span>
                    </div>

                    <div class="p-3 bg-primary-subtle rounded-3 d-flex justify-content-between align-items-center mb-3">
                        <span class="fw-bold text-primary fs-6">Tổng Thanh Toán:</span>
                        <span class="fs-4 fw-bold text-danger" th:text="${order.totalAmount != null ? #numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT') + ' đ' : '0 đ'}">
                            0 đ
                        </span>
                    </div>

                    <div class="alert alert-info py-2 small mb-0 border-0">
                        <i class="fa-solid fa-shield-halved me-1"></i> Đảm bảo thông tin của bạn được bảo mật tuyệt đối.
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
