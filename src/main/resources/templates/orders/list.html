<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Đơn Hàng - Premium Store</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8f9fa;
            color: #2b2d42;
        }
        .main-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            background: #ffffff;
        }
        .table-custom th {
            background-color: #f1f5f9;
            color: #475569;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
            border: none;
            padding: 14px 16px;
        }
        .table-custom td {
            padding: 16px;
            vertical-align: middle;
            border-color: #f1f5f9;
        }
        .badge-status {
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.75rem;
        }
        .btn-action {
            border-radius: 8px;
            padding: 6px 14px;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .btn-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(13, 110, 253, 0.25);
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <!-- Header Section -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold mb-1"><i class="fa-solid fa-receipt text-primary me-2"></i>Danh Sách Đơn Hàng</h3>
                <p class="text-muted mb-0">Theo dõi và quản lý đơn hàng của hệ thống</p>
            </div>
            <a href="/cart/checkout" class="btn btn-primary btn-action shadow-sm">
                <i class="fa-solid fa-cart-plus me-1"></i> Tạo Đơn Mới
            </a>
        </div>

        <!-- Order List Table -->
        <div class="card main-card">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-custom align-middle mb-0">
                        <thead>
                            <tr>
                                <th>Mã Đơn</th>
                                <th>Khách Hàng</th>
                                <th>Số Điện Thoại</th>
                                <th>Thanh Toán</th>
                                <th>Tổng Tiền</th>
                                <th>Trạng Thái</th>
                                <th>Ngày Đặt</th>
                                <th class="text-end">Hành Động</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="order : ${orders}">
                                <td class="fw-bold text-primary">#<span th:text="${order.id}">1</span></td>
                                <td class="fw-semibold" th:text="${order.customerName}">Nguyễn Văn A</td>
                                <td class="text-muted" th:text="${order.phone}">0901234567</td>
                                <td>
                                    <span class="badge bg-light text-dark border" th:text="${order.paymentMethod}">COD</span>
                                </td>
                                <td class="fw-bold text-danger" 
                                    th:text="${order.totalAmount != null ? #numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT') + ' đ' : '0 đ'}">
                                    500,000 đ
                                </td>
                                <td>
                                    <span class="badge badge-status bg-success-subtle text-success border border-success-subtle" 
                                          th:text="${order.status}">Đã xác nhận</span>
                                </td>
                                <td class="text-muted" 
                                    th:text="${order.orderDate != null ? #temporals.format(order.orderDate, 'dd/MM/yyyy HH:mm') : 'N/A'}">
                                    05/10/2026 10:00
                                </td>
                                <td class="text-end">
                                    <a th:href="@{/orders/{id}(id=${order.id})}" class="btn btn-outline-primary btn-action">
                                        <i class="fa-solid fa-eye me-1"></i> Chi tiết
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(orders)}">
                                <td colspan="8" class="text-center py-5 text-muted">
                                    <i class="fa-solid fa-box-open fa-3x mb-3 text-secondary d-block"></i>
                                    Chưa có đơn hàng nào được tạo.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
